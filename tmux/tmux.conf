unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Settings formerly pulled in from tmux-sensible.
set -s escape-time 10
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
setw -g aggressive-resize on

# Truecolor for Vim's 'termguicolors', and let programs (Vim's OSC52 copy)
# set the system clipboard through Ghostty.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g set-clipboard on

# Enable scrolling, pane selection, and resizing with the mouse.
set -g mouse on

# Number windows and panes from 1, and keep window numbers contiguous.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New splits and windows open in the current pane's directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# Window navigation: Prefix + Shift+h/l
bind -r H previous-window
bind -r L next-window

# Session picker: Prefix+s, then / to search; Enter switches sessions.
bind s choose-tree -s -Z

# Seamless Ctrl-h/j/k/l navigation across Vim splits and tmux panes. When the
# active process is Vim, pass the key through to vim-tmux-navigator; otherwise,
# move directly between tmux panes. Moving stops at the window's edge instead
# of wrapping to the other side.
bind-key -n C-h if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+[[:space:]]+g?(view|n?vim?x?)(diff)?$'" "send-keys C-h" "if -F '#{pane_at_left}' '' 'select-pane -L'"
bind-key -n C-j if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+[[:space:]]+g?(view|n?vim?x?)(diff)?$'" "send-keys C-j" "if -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind-key -n C-k if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+[[:space:]]+g?(view|n?vim?x?)(diff)?$'" "send-keys C-k" "if -F '#{pane_at_top}' '' 'select-pane -U'"
bind-key -n C-l if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+[[:space:]]+g?(view|n?vim?x?)(diff)?$'" "send-keys C-l" "if -F '#{pane_at_right}' '' 'select-pane -R'"

# C-l moves between panes, so Prefix + C-l clears the screen instead.
bind C-l send-keys C-l

# Copy mode uses vi keys: v selects, y copies (to the system clipboard too).
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-h if -F '#{pane_at_left}' '' 'select-pane -L'
bind -T copy-mode-vi C-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -T copy-mode-vi C-k if -F '#{pane_at_top}' '' 'select-pane -U'
bind -T copy-mode-vi C-l if -F '#{pane_at_right}' '' 'select-pane -R'

# Theme: catppuccin/tmux in the Frappe flavor, to match Ghostty and Vim. The
# @catppuccin_* options must be set before TPM loads the plugin below.
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_date_time_text " %H:%M"
set -g @catppuccin_host_text " #h"

# The status bar sits at the top. The session pill turns red while the prefix
# is pressed.
set -g status-position top
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-left-length 30
set -g status-right "#{E:@catppuccin_status_date_time} #{E:@catppuccin_status_host}"
set -g status-right-length 100

# One standard status row: windows on the left, clock and hostname on the right.
set -g status on
set -g status-justify left
set -gu status-format

# Border shape (colors come from the theme).
set -g pane-border-lines heavy
set -g pane-border-indicators arrows

# Plugins, managed by TPM: Prefix + I installs, Prefix + U updates. TPM clones
# itself and installs the plugins on the first start of a new machine.
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "catppuccin/tmux#v2.3.1"
# Prefix+F opens tmux-fzf's searchable session/window/pane menu.
set -g @plugin "sainnhe/tmux-fzf"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
# Continuum must load after the theme; it appends a save hook to status-right.
set -g @plugin "tmux-plugins/tmux-continuum"

if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run "~/.tmux/plugins/tpm/tpm"
