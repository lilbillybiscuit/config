unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable scrolling, pane selection, and resizing with the mouse.
set -g mouse on

# Vim-style pane navigation: Prefix + h/j/k/l
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Window navigation: Prefix + Shift+h/l
bind -r H previous-window
bind -r L next-window

# Seamless Ctrl-h/j/k/l navigation across Vim splits and tmux panes. When the
# active process is Vim, pass the key through to vim-tmux-navigator; otherwise,
# move directly between tmux panes.
bind-key -n C-h if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+[[:space:]]+g?(view|n?vim?x?)(diff)?$'" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+[[:space:]]+g?(view|n?vim?x?)(diff)?$'" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+[[:space:]]+g?(view|n?vim?x?)(diff)?$'" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+[[:space:]]+g?(view|n?vim?x?)(diff)?$'" "send-keys C-l" "select-pane -R"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Load defaults last so prefix-sensitive setup sees the configured C-a prefix.
run-shell ~/config/tmux/tmux-sensible/sensible.tmux
