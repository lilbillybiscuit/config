unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Settings formerly pulled in from tmux-sensible.
set -s escape-time 10
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
setw -g aggressive-resize on

# Truecolor for Vim's 'termguicolors', and let programs (Vim's OSC52 copy)
# set the system clipboard through Ghostty.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g set-clipboard on

# Enable scrolling, pane selection, and resizing with the mouse.
set -g mouse on

# Number windows and panes from 1, and keep window numbers contiguous.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New splits and windows open in the current pane's directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# Window navigation: Prefix + Shift+h/l
bind -r H previous-window
bind -r L next-window

# Seamless Ctrl-h/j/k/l navigation across Vim splits and tmux panes. When the
# active process is Vim, pass the key through to vim-tmux-navigator; otherwise,
# move directly between tmux panes. Moving stops at the window's edge instead
# of wrapping to the other side.
bind-key -n C-h if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+[[:space:]]+g?(view|n?vim?x?)(diff)?$'" "send-keys C-h" "if -F '#{pane_at_left}' '' 'select-pane -L'"
bind-key -n C-j if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+[[:space:]]+g?(view|n?vim?x?)(diff)?$'" "send-keys C-j" "if -F '#{pane_at_bottom}' '' 'select-pane -D'"
bind-key -n C-k if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+[[:space:]]+g?(view|n?vim?x?)(diff)?$'" "send-keys C-k" "if -F '#{pane_at_top}' '' 'select-pane -U'"
bind-key -n C-l if-shell "ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+[[:space:]]+g?(view|n?vim?x?)(diff)?$'" "send-keys C-l" "if -F '#{pane_at_right}' '' 'select-pane -R'"

# C-l moves between panes, so Prefix + C-l clears the screen instead.
bind C-l send-keys C-l

# Copy mode uses vi keys: v selects, y copies (to the system clipboard too).
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-h if -F '#{pane_at_left}' '' 'select-pane -L'
bind -T copy-mode-vi C-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -T copy-mode-vi C-k if -F '#{pane_at_top}' '' 'select-pane -U'
bind -T copy-mode-vi C-l if -F '#{pane_at_right}' '' 'select-pane -R'

# Status bar, borders, and selection in Catppuccin Frappe to match Ghostty.
set -g status-style "bg=#292c3c,fg=#c6d0f5"
set -g status-left "#[bg=#ca9ee6,fg=#232634,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#a5adce]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#ca9ee6,fg=#232634,bold] #I:#W#{?window_zoomed_flag, Z,} "
set -g pane-border-style "fg=#414559"
set -g pane-active-border-style "fg=#ca9ee6"
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g mode-style "bg=#ca9ee6,fg=#232634"
set -g message-style "bg=#414559,fg=#c6d0f5"
